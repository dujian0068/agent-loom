[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentloom-test-file-provider"
version = "1.2.3"
requires-python = ">=3.11"

[project.entry-points."agentloom.workspace_backends"]
test-files = "loom_test_files:TestFiles"
unselected-files = "loom_test_files.unselected:NeverLoad"

[tool.setuptools.packages.find]
where = ["src"]
