[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentloom-sdk"
version = "0.1.0a1"
description = "Standalone, recoverable ReAct and Plan–Executor agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1", "jsonschema>=4.23,<5", "referencing>=0.35,<1", "PyYAML>=6,<7", "rfc8785>=0.1.4,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "pytest-xdist>=3.6,<4", "ruff>=0.9,<1"]
mcp = ["mcp>=1.30,<2"]

[project.entry-points."agentloom.workspace_backends"]
local = "agentloom.workspace.local:LocalWorkspaceBackend"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentloom = ["py.typed"]
"agentloom.prompts" = ["NOTICE.md", "LICENSE.langchain", "sources.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
