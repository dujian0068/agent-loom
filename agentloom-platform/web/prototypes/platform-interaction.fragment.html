<script>

  function esc(value) { return String(value == null ? '' : value).replace(/[&<>"']/g, function(c) { return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; }); }

        if (active(app.run)) { clearTimeout(app.run.timer); app.run.status = 'stopped'; app.run.supplements.forEach(function(s) { if (s.state === 'accepted' || s.state === 'sending') s.state = 'pending'; }); }
        app.otherRuns = 0;
      }
      if (job.stage === 2 && options.scenario === 'publish-failure' && !job.retried) {
        job.failed = true; render(); feedback('发布停在运行清理阶段，候选版本未启用。'); return;
      }
      job.stage += 1;
      if (job.stage === 4) { app.version = job.target; app.publishedRevision = job.revision; app.publishedDescription = job.description; app.publishedPrompt = job.prompt; app.publishedModel = job.model; app.publishedTools = job.tools; render(); feedback('v' + app.version + ' 已发布。'); saveState(); }
      else { render(); feedback(phases[job.stage]); advanceJob(app); }
    }, 1100);
  }
  root.addEventListener('input', function(event) {
    const field = event.target.dataset.field;
    const app = applications[selected];
    if (field === 'message') {
      app.run.typed = event.target.value;
      const send = main.querySelector('[data-action="send"]');
      if (send) send.disabled = !app.run.typed.trim() || app.run.supplements.some(function(s) { return s.state === 'sending'; }) || gated(app) || app.run.status === 'stopping' || !app.version || options.connection !== 'online' || ['submitting','saved','accepted'].includes(app.run.status);
    } else if (['description','prompt','model','tools','executors'].includes(field)) {
      app[field] = field === 'tools' ? event.target.checked : event.target.value;
      app.dirty = true; app.valid = false; updateEditorButtons(app);
    }
  });
  root.addEventListener('keydown', function(event) {
    if (event.target.dataset.field === 'message' && event.key === 'Enter' && !event.shiftKey && !event.isComposing) {
      event.preventDefault();
      const send = main.querySelector('[data-action="send"]');
      if (send && !send.disabled) send.click();
    }
  });
  root.addEventListener('click', function(event) {
    const target = event.target.closest('button');
    if (!target || target.disabled) return;
    if (target.dataset.nav) { navigate(target.dataset.nav); return; }
    const action = target.dataset.action;
    const app = applications[selected];
    const run = app.run;
    if (!action) return;
    if (['editor','chat','releases'].includes(action)) { navigate(action); return; }
    if (action.startsWith('select-')) { navigate(action.slice(7), Number(target.dataset.index)); return; }
    if (action === 'close') { closeDialog(); return; }
    if (action === 'create') {
      openDialog('新建应用', '<div class="lp-field"><label for="lp-new-name">应用名称</label><input id="lp-new-name" maxlength="100" placeholder="例如：文档整理助手"></div><div class="lp-field" style="margin-top:16px"><label for="lp-new-description">应用描述（选填）</label><textarea id="lp-new-description" maxlength="2000" aria-describedby="lp-new-description-hint" placeholder="例如：整理团队文档，提取关键结论并生成摘要。"></textarea><small id="lp-new-description-hint">说明应用的用途、适用场景和预期结果，最多 2000 字。创建后可继续修改。</small></div><div class="lp-field" style="margin-top:16px"><label for="lp-new-mode">执行模式</label><select id="lp-new-mode"><option value="ReAct">ReAct · 一个 Agent 连续完成任务</option><option value="Plan">Plan · 计划与专业执行器分工</option></select><small>创建后不可更改</small></div><p id="lp-create-error" role="alert" class="lp-muted"></p><div class="lp-dialog-actions">' + button('取消','close') + button('创建并配置','confirm-create','lp-primary') + '</div>', 'create');
    } else if (action === 'confirm-create') {
      const name = root.querySelector('#lp-new-name').value.trim();
      if (!name || name.length > 100) { root.querySelector('#lp-create-error').textContent = '请填写 1–100 字的应用名称。'; root.querySelector('#lp-new-name').focus(); return; }
      const description = root.querySelector('#lp-new-description').value.trim();
      if (description.length > 2000) { root.querySelector('#lp-create-error').textContent = '应用描述最多 2000 字，请缩短后创建。'; root.querySelector('#lp-new-description').focus(); return; }
      const mode = root.querySelector('#lp-new-mode').value;
      applications.push({name:name,mode:mode,description:description,savedDescription:description,publishedDescription:'',version:0,revision:1,publishedRevision:0,prompt:'',model:'',tools:false,dirty:false,valid:false,conflict:false,otherRuns:0,job:null,executors:'',savedPrompt:'',savedModel:'',savedTools:false,savedExecutors:'',run:{status:'idle',version:0,input:'',supplements:[],typed:'',timer:null}});
      closeDialog(); selected = applications.length - 1; view = 'editor'; render(); feedback('应用已创建，请配置模型和提示词。');
    } else if (action === 'save') persistDraft(app);
    else if (action === 'validate') {
      if (!app.model || !app.prompt.trim() || app.mode === 'Plan' && !(app.executors || '').trim()) {
        main.querySelector('#lp-validation').innerHTML = '<div class="lp-callout lp-error" role="alert">请补全' + (!app.model ? '模型连接' : !app.prompt.trim() ? '系统提示词' : '专业执行器职责') + '，保存后重新校验。</div>';
      } else { app.valid = true; render(); feedback('配置校验通过；本次未调用真实模型。'); }
    } else if (action === 'publish') {
      const count = (active(run) ? 1 : 0) + app.otherRuns;
      openDialog('发布 v' + (app.version + 1), '<p>将固定当前草稿 r' + app.revision + '，发布后空间成员可以使用。</p><dl class="lp-facts"><dt>本次配置</dt><dd>' + esc(app.mode) + ' · ' + esc(app.model) + '</dd><dt>变更范围</dt><dd>应用描述、系统提示词与已选能力，以当前草稿为准</dd><dt>影响任务</dt><dd>' + count + ' 个活动任务' + (active(run) ? '（含你的 1 个任务）' : '') + '</dd></dl><div class="lp-callout lp-warning">' + (count ? '发布会停止旧配置上的活动任务。' : '') + '发布期间暂停新提问与补充输入。已完成历史保留。</div><div class="lp-dialog-actions">' + button('返回检查','close') + button(count ? '停止相关任务并发布 v' + (app.version + 1) : '发布 v' + (app.version + 1),'confirm-publish','lp-primary') + '</div>', 'publish');
    } else if (action === 'confirm-publish') {
      app.job = {stage:0,target:app.version+1,revision:app.revision,description:app.description,prompt:app.prompt,model:app.model,tools:app.tools,executors:app.executors,failed:false,retried:false,timer:null};
      closeDialog(); view = 'releases'; render(); feedback('发布任务已创建，候选版本已固定。'); advanceJob(app);
    } else if (action === 'retry-publish') { app.job.failed = false; app.job.retried = true; render(); feedback('正在从失败阶段重试原发布任务。'); advanceJob(app); }
    else if (action === 'publish-diagnostic') {
      openDialog('发布诊断', '<dl class="lp-facts"><dt>候选版本</dt><dd>v' + app.job.target + '</dd><dt>失败阶段</dt><dd>等待运行清理</dd><dt>接入状态</dt><dd>新输入已暂停</dd><dt>处理方式</dt><dd>管理员处理清理异常后，重试原发布任务。</dd></dl><div class="lp-dialog-actions">' + button('关闭','close') + '</div>', 'diagnostic');
    } else if (action === 'version-detail') {
      openDialog('当前发布 v' + app.version, '<p class="lp-muted">发布快照不可变，后续草稿不会修改此版本。</p><dl class="lp-facts"><dt>应用描述</dt><dd class="lp-description">' + esc(app.publishedDescription || '未填写应用描述') + '</dd><dt>执行模式</dt><dd>' + app.mode + '</dd><dt>模型连接</dt><dd>' + esc(app.publishedModel) + '</dd><dt>能力版本</dt><dd>' + (app.publishedTools ? '读取项目变更 · v1.2' : '未选择工具') + '</dd></dl><h3>系统提示词</h3><p>' + esc(app.publishedPrompt) + '</p><div class="lp-dialog-actions">' + button('关闭','close') + '</div>', 'version');
    } else if (action === 'toggle-progress') { options.progress = !options.progress; render(); }
    else if (action === 'stop') stopRun(app);
    else if (action === 'send') {
      const text = run.typed.trim();
      if (!text || gated(app) || run.status === 'stopping') return;
      if (active(run)) {
        const supplement = {text:text,state:'sending'};
        run.supplements.push(supplement); render(); feedback('正在提交补充。');
        setTimeout(function() {
          if (run.typed.trim() === text) run.typed = '';
          supplement.state = active(run) && run.status !== 'stopping' ? 'accepted' : 'pending'; render(); feedback(supplement.state === 'pending' ? '补充已接收，待下轮生效。' : '补充已接收，等待本轮采用。');
        }, 650);
        completeLater(app);
      } else {
        if (run.input) {
          if (!run.history) run.history = [];
          run.history.push({input:run.input,status:run.status,version:run.version,supplements:run.supplements});
          run.supplements = [];
        }
        run.input = text; run.version = app.version; run.status = 'submitting';
        render(); feedback('正在提交问题。');
        clearTimeout(run.timer);
        run.timer = setTimeout(function() {
          if (run.status !== 'submitting') return; runUpdate(app, 'saved');
          run.timer = setTimeout(function() {
            if (run.status !== 'saved') return; runUpdate(app, 'accepted');
            run.timer = setTimeout(function() { if (run.status !== 'accepted') return; runUpdate(app, 'running'); completeLater(app); }, 800);
          }, 800);
        }, 500);
      }
    } else if (action === 'run-detail') {
      openDialog('运行详情', '<dl class="lp-facts"><dt>应用版本</dt><dd>v' + run.version + '</dd><dt>业务状态</dt><dd>' + labels[run.status] + '</dd><dt>可见范围</dt><dd>仅自己可见</dd><dt>后台清理</dt><dd>' + (['completed','stopped'].includes(run.status) ? '已完成' : '待任务结束') + '</dd></dl><p class="lp-muted">状态与清理结果分别展示；关闭页面不停止任务。</p><div class="lp-dialog-actions">' + button('关闭','close') + '</div>', 'run');
    } else if (action === 'compare') {
      openDialog('比较系统提示词', '<h3>我的修改</h3><p>' + esc(app.prompt) + '</p><h3>其他成员保存的版本</h3><p>整理研发进展，重点列出尚未解决的问题。所有结论需来自用户提供的信息。</p><p class="lp-muted">选择保留哪份内容，再基于最新版本重新保存。</p><div class="lp-dialog-actions">' + button('继续编辑','close') + button('载入最新内容','resolve-latest') + button('保留我的内容再保存','resolve-mine','lp-primary') + '</div>', 'conflict');
    } else if (action === 'resolve-latest' || action === 'resolve-mine') {
      if (action === 'resolve-latest') app.prompt = '整理研发进展，重点列出尚未解决的问题。所有结论需来自用户提供的信息。';
      app.revision += 1; app.conflictHandled = true; app.conflict = false; app.dirty = true; app.valid = false; closeDialog(); render(); feedback('已对齐最新版本，请确认内容后保存。');
    } else if (action === 'discard') {
      app.description = app.savedDescription; app.prompt = app.savedPrompt; app.model = app.savedModel; app.tools = app.savedTools; app.executors = app.savedExecutors; app.dirty = false; app.valid = false;
      closeDialog(); const destination = nextView; nextView = null; navigate(destination.view, destination.index);
    } else if (action === 'save-leave') {
      closeDialog(); if (persistDraft(app)) { const destination = nextView; nextView = null; navigate(destination.view, destination.index); }
    }
    saveState();
  });
  applications.forEach(function(app) { app.savedDescription = app.description; app.publishedDescription = app.description; app.savedPrompt = app.prompt; app.savedModel = app.model; app.savedTools = app.tools; app.savedExecutors = app.executors; app.publishedPrompt = app.prompt; app.publishedModel = app.model; app.publishedTools = app.tools; });
  dialog.addEventListener('cancel', function() { modal = null; });
  restore(window.openai && window.openai.widgetState);
  render();
  window.addEventListener('openai:set_globals', function(event) {
    const globals = event.detail && event.detail.globals;
    if (globals && Object.prototype.hasOwnProperty.call(globals, 'widgetState')) { restore(globals.widgetState); render(); }
  });
  if (standalone) {
    previewSettings.hidden = false;
    previewSettings.addEventListener('change', function(event) {
      const key = event.target.dataset.preview;
      if (!['role','connection','scenario','progress'].includes(key)) return;
      options[key] = key === 'progress' ? event.target.checked : event.target.value;
      if (dialog.open) closeDialog();
      render(); saveState();
    });
  } else if (globalThis.Tweak) {
    const tweak = new Tweak({container: root, onChange: function() { if (dialog.open) closeDialog(); render(); saveState(); }});
    tweak.addSelect(options, 'role', {label:'使用者视角', options:[{label:'编辑者',value:'editor'},{label:'使用者',value:'viewer'},{label:'管理员',value:'admin'}]});
    tweak.addToggle(options, 'progress', {label:'展开运行过程'});
    tweak.addSelect(options, 'connection', {label:'连接状态', options:[{label:'正常连接',value:'online'},{label:'断线重连',value:'reconnecting'}]});
    tweak.addSelect(options, 'scenario', {label:'异常场景', options:[{label:'正常流程',value:'normal'},{label:'保存时草稿冲突',value:'conflict'},{label:'发布时清理失败',value:'publish-failure'}]});
  }
})();
</script>
