        if (run.input) {
          if (!run.history) run.history = [];
          run.history.push({input:run.input,status:run.status,version:run.version,supplements:run.supplements});
          run.supplements = [];
        }
        run.input = text; run.version = app.version; run.status = 'submitting';
        render(); feedback('正在提交问题。');
        clearTimeout(run.timer);
        run.timer = setTimeout(function() {
          if (run.status !== 'submitting') return; runUpdate(app, 'saved');
          run.timer = setTimeout(function() {
            if (run.status !== 'saved') return; runUpdate(app, 'accepted');
            run.timer = setTimeout(function() { if (run.status !== 'accepted') return; runUpdate(app, 'running'); completeLater(app); }, 800);
          }, 800);
        }, 500);
      }
    } else if (action === 'run-detail') {
      openDialog('运行详情', '<dl class="lp-facts"><dt>应用版本</dt><dd>v' + run.version + '</dd><dt>业务状态</dt><dd>' + labels[run.status] + '</dd><dt>可见范围</dt><dd>仅自己可见</dd><dt>后台清理</dt><dd>' + (['completed','stopped'].includes(run.status) ? '已完成' : '待任务结束') + '</dd></dl><p class="lp-muted">状态与清理结果分别展示；关闭页面不停止任务。</p><div class="lp-dialog-actions">' + button('关闭','close') + '</div>', 'run');
    } else if (action === 'compare') {
      openDialog('比较系统提示词', '<h3>我的修改</h3><p>' + esc(app.prompt) + '</p><h3>其他成员保存的版本</h3><p>整理研发进展，重点列出尚未解决的问题。所有结论需来自用户提供的信息。</p><p class="lp-muted">选择保留哪份内容，再基于最新版本重新保存。</p><div class="lp-dialog-actions">' + button('继续编辑','close') + button('载入最新内容','resolve-latest') + button('保留我的内容再保存','resolve-mine','lp-primary') + '</div>', 'conflict');
    } else if (action === 'resolve-latest' || action === 'resolve-mine') {
      if (action === 'resolve-latest') app.prompt = '整理研发进展，重点列出尚未解决的问题。所有结论需来自用户提供的信息。';
      app.revision += 1; app.conflictHandled = true; app.conflict = false; app.dirty = true; app.valid = false; closeDialog(); render(); feedback('已对齐最新版本，请确认内容后保存。');
    } else if (action === 'discard') {
      Object.assign(app,clone(app.savedDraft)); app.dirty = false; app.valid = false; app.validationErrors = [];
      closeDialog(); const destination = nextView; nextView = null; navigate(destination.view, destination.index);
    } else if (action === 'save-leave') {
      closeDialog(); if (persistDraft(app)) { const destination = nextView; nextView = null; navigate(destination.view, destination.index); }
    }
    saveState();
  });
  applications.forEach(function(app) {
    app.capabilities = {tools:['project-changes','read','list'],skills:['weekly-report'],mcpEnabled:false,mcpMembers:[],exec:false};
    app.environment = defaultEnvironment();
    app.executors = app.mode === 'Plan' ? [
      {key:'research',name:'资料分析',prompt:'整理来源与事实，记录可追溯的依据。',capabilities:{tools:['read'],skills:[],mcpEnabled:true,mcpMembers:['search_documents','read_document'],exec:false}},
      {key:'writer',name:'报告编写',prompt:'合并结论与待验证事项，生成结构清晰的报告。',capabilities:{tools:['read','write'],skills:['weekly-report'],mcpEnabled:false,mcpMembers:[],exec:false}}
    ] : [];
    delete app.tools;
    app.savedDraft = configurationSnapshot(app); app.publishedDraft = configurationSnapshot(app);
  });
  dialog.addEventListener('cancel', function() { modal = null; });
  restore(window.openai && window.openai.widgetState);
  render();
  window.addEventListener('openai:set_globals', function(event) {
    const globals = event.detail && event.detail.globals;
    if (globals && Object.prototype.hasOwnProperty.call(globals, 'widgetState')) { restore(globals.widgetState); render(); }
  });
  if (standalone) {
    previewSettings.hidden = false;
    previewSettings.addEventListener('change', function(event) {
      const key = event.target.dataset.preview;
      if (!['role','connection','scenario','progress','sandboxReady'].includes(key)) return;
      options[key] = key === 'progress' ? event.target.checked : key === 'sandboxReady' ? event.target.value === 'true' : event.target.value;
      if (key === 'sandboxReady') { applications.forEach(function(app) { app.valid = false; app.validationErrors = []; }); feedback(view === 'editor' ? '环境服务状态已变化，请重新校验。' : ''); }
      if (dialog.open) closeDialog();
      render(); saveState();
    });
  } else if (globalThis.Tweak) {
    const tweak = new Tweak({container: root, onChange: function() { if (dialog.open) closeDialog(); render(); saveState(); }});
    tweak.addSelect(options, 'role', {label:'使用者视角', options:[{label:'编辑者',value:'editor'},{label:'使用者',value:'viewer'},{label:'管理员',value:'admin'}]});
    tweak.addToggle(options, 'progress', {label:'展开运行过程'});
    tweak.addSelect(options, 'connection', {label:'连接状态', options:[{label:'正常连接',value:'online'},{label:'断线重连',value:'reconnecting'}]});
    tweak.addSelect(options, 'scenario', {label:'异常场景', options:[{label:'正常流程',value:'normal'},{label:'保存时草稿冲突',value:'conflict'},{label:'发布时清理失败',value:'publish-failure'}]});
    tweak.addToggle(options, 'sandboxReady', {label:'沙箱服务已接入（模拟）'});
  }
})();
</script>
