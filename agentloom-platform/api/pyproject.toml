[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agentloom-platform"
version = "0.1.0"
description = "Team Agent platform using LangChain and LangGraph"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2,<3",
  "alembic>=1.14,<2", "pydantic-settings>=2.6,<3",
  "langchain>=1,<2", "langgraph>=1,<2", "langchain-openai>=1,<2",
  "langgraph-checkpoint-sqlite>=3,<4", "langgraph-checkpoint-postgres>=3,<4",
  "langchain-mcp-adapters>=0.1,<1", "psycopg[binary,pool]>=3.2,<4",
  "cryptography>=44", "jsonschema>=4.23,<5", "PyYAML>=6,<7",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.9"]

[project.scripts]
agentloom-platform = "agentloom_platform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["../tests"]

[tool.ruff]
line-length = 110
