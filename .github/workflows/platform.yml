name: Platform checks
on:
  push:
    paths: ['agentloom-platform/**', '.github/workflows/platform.yml']
  pull_request:
    paths: ['agentloom-platform/**', '.github/workflows/platform.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: agentloom-platform/web/package-lock.json
      - run: npm ci && npm run build
        working-directory: agentloom-platform/web
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: agentloom
          POSTGRES_PASSWORD: platform-ci-only
          POSTGRES_DB: agentloom_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U agentloom -d agentloom_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: agentloom-platform/api/requirements.lock
      - run: pip install -r requirements.lock
        working-directory: agentloom-platform/api
      - run: ruff check src migrations ../tests
        working-directory: agentloom-platform/api
      - name: SQLite contracts and process recovery
        run: PYTHONPATH=src python -m pytest ../tests -q
        working-directory: agentloom-platform/api
      - name: PostgreSQL and durable checkpointer contracts
        run: PYTHONPATH=src python -m pytest ../tests -q
        working-directory: agentloom-platform/api
        env:
          PLATFORM_TEST_DATABASE_URL: postgresql+psycopg://agentloom:platform-ci-only@localhost:5432/agentloom_test
          PLATFORM_TEST_CHECKPOINT_URL: postgresql://agentloom:platform-ci-only@localhost:5432/agentloom_test
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker build -f deploy/api.Dockerfile -t platform-api-check .
        working-directory: agentloom-platform
      - run: docker build -f deploy/web.Dockerfile -t platform-web-check .
        working-directory: agentloom-platform
      - name: Prepare disposable deployment
        run: |
          python - <<'PY'
          import base64, os, secrets
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write("POSTGRES_PASSWORD=" + secrets.token_hex(24) + "\n")
              output.write("PLATFORM_SECRET_KEY=" + base64.urlsafe_b64encode(secrets.token_bytes(32)).decode() + "\n")
              output.write("PLATFORM_ADMIN_PASSWORD=" + secrets.token_hex(24) + "\n")
              output.write("PLATFORM_ALLOW_TEST_MODEL=true\n")
          PY
      - name: Start independently deployed services
        run: docker compose -f deploy/compose.yaml up -d --build --wait
        working-directory: agentloom-platform
      - name: Initialize test administrator
        run: docker compose -f deploy/compose.yaml exec -T -e PLATFORM_ADMIN_PASSWORD api agentloom-platform init --username ci_admin
        working-directory: agentloom-platform
      - name: Web proxy, migrations, API and Worker smoke
        run: python tests/deployment_smoke.py
        working-directory: agentloom-platform
      - name: Failure diagnostics
        if: failure()
        run: docker compose -f deploy/compose.yaml logs --tail 100
        working-directory: agentloom-platform
      - name: Remove disposable deployment
        if: always()
        run: docker compose -f deploy/compose.yaml down -v
        working-directory: agentloom-platform
